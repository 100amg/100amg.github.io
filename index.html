
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artworks | Amishi Gupta</title>
  <meta name="description" content="A subset of things I've made over the years, from detailed recreations to experiments with colour, patterns, lettering and form!">

  <style>
    :root {
      --background: #faf9f6;
      --text: #292824;
      --muted: #77736d;
      --border: #e7e3dc;
      --accent: #76624d;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.7;
    }

    a { color: inherit; }

    header {
      padding: 24px 6%;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      font-size: 1.25rem;
      letter-spacing: .02em;
      text-decoration: none;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    nav a {
      text-decoration: none;
      font: 13px Arial, sans-serif;
      color: var(--muted);
    }

    nav a:hover { color: var(--text); }

    .hero {
      max-width: 900px;
      margin: 0 auto;
      padding: 100px 24px 85px;
      text-align: center;
    }

    .eyebrow {
      font: 11px Arial, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: normal;
      line-height: 1.15;
      margin: 20px 0;
    }

    .hero p {
      max-width: 570px;
      margin: auto;
      font-size: 1.08rem;
      color: var(--muted);
    }

    main {
      max-width: 1250px;
      margin: auto;
      padding: 0 6% 100px;
    }

    .collection {
      padding: 75px 0;
      border-top: 1px solid var(--border);
      scroll-margin-top: 30px;
    }

    .collection h2 {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: normal;
      margin: 0 0 15px;
    }

    .description {
      max-width: 780px;
      margin-bottom: 45px;
      color: #605c56;
      font-size: 1rem;
      white-space: pre-line;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 35px 25px;
    }

    .artwork { min-width: 0; }

    .artwork img {
      display: block;
      width: 100%;
      height: 330px;
      object-fit: contain;
      background: #f0eee9;
      cursor: zoom-in;
      transition: opacity .2s;
    }

    .artwork img:hover { opacity: .88; }

    .artwork-info {
      padding: 12px 0;
      font: 13px/1.6 Arial, sans-serif;
      color: var(--muted);
    }

    .artwork-info p { margin: 0 0 4px; }

    .attribution a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    footer {
      padding: 35px 6%;
      border-top: 1px solid var(--border);
      text-align: center;
      font: 12px Arial, sans-serif;
      color: var(--muted);
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(20, 19, 17, .95);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 55px 20px 30px;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 95%;
      max-height: 78vh;
      object-fit: contain;
    }

    .lightbox-caption {
      margin-top: 18px;
      color: #eee;
      font: 13px Arial, sans-serif;
      text-align: center;
    }

    .close-lightbox {
      position: absolute;
      top: 16px;
      right: 25px;
      background: transparent;
      border: 0;
      color: white;
      font-size: 35px;
      cursor: pointer;
    }

    .error {
      padding: 30px;
      color: #8b3939;
      background: #f8eeee;
    }

    @media (max-width: 850px) {
      .gallery { grid-template-columns: repeat(2, 1fr); }
      .artwork img { height: 270px; }
    }

    @media (max-width: 550px) {
      header { justify-content: center; }
      nav { justify-content: center; gap: 12px; }
      .hero { padding: 70px 20px; }
      .collection { padding: 55px 0; }
      .gallery { grid-template-columns: 1fr; }
      .artwork img { height: auto; max-height: 480px; }
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="#">Amishi</a>
    <nav id="navigation">
      <a href="#hyperrealistic">Hyperrealistic</a>
      <a href="#abstract">Abstract</a>
      <a href="#pottery">Pottery</a>
      <a href="#typography">Typography</a>
    </nav>
  </header>

  <section class="hero">
    <div class="eyebrow">A personal collection</div>
    <h1>Art & Explorations</h1>
    <p>
      A collection of things I've made over the years,
      from detailed recreations to experiments with
      colour, patterns, lettering and form.
    </p>
  </section>

  <main id="collections">
    <p>Loading artwork...</p>
  </main>

  <footer>
    Made with curiosity and care.
  </footer>

  <div class="lightbox" id="lightbox"
       role="dialog" aria-modal="true"
       aria-label="Artwork viewer">
    <button class="close-lightbox"
            id="close-lightbox"
            aria-label="Close artwork viewer">
      &times;
    </button>
    <img id="lightbox-image" alt="Enlarged artwork">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <script>
    const container = document.getElementById("collections");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");
    const lightboxCaption = document.getElementById("lightbox-caption");

    function isURL(value) {
      try {
        const url = new URL(value);
        return ["https:", "http:"].includes(url.protocol);
      } catch {
        return false;
      }
    }

    function createArtwork(artwork, sectionTitle, index) {
      const figure = document.createElement("article");
      figure.className = "artwork";

      const image = document.createElement("img");
      image.src = artwork.image;
      image.alt = artwork.alt || `${sectionTitle} artwork ${index + 1}`;
      image.loading = "lazy";

      image.addEventListener("click", () => {
        lightboxImage.src = artwork.image;
        lightboxImage.alt = image.alt;
        lightboxCaption.textContent = artwork.completed || "";
        lightbox.classList.add("open");
        document.body.style.overflow = "hidden";
      });

      figure.appendChild(image);

      const info = document.createElement("div");
      info.className = "artwork-info";

      if (artwork.completed) {
        const date = document.createElement("p");
        date.textContent = artwork.completed;
        info.appendChild(date);
      }

      if (artwork.attribution) {
        const attribution = document.createElement("p");
        attribution.className = "attribution";

        if (isURL(artwork.attribution)) {
          const link = document.createElement("a");
          link.href = artwork.attribution;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "View original inspiration";
          attribution.appendChild(link);
        } else {
          attribution.textContent = artwork.attribution;
        }

        info.appendChild(attribution);
      }

      figure.appendChild(info);
      return figure;
    }

    function createSection(section) {
      const element = document.createElement("section");
      element.className = "collection";
      element.id = section.id;

      const heading = document.createElement("h2");
      heading.textContent = section.title;
      element.appendChild(heading);

      const description = document.createElement("p");
      description.className = "description";
      description.textContent = section.description || "";
      element.appendChild(description);

      const gallery = document.createElement("div");
      gallery.className = "gallery";

      (section.artworks || []).forEach((artwork, index) => {
        gallery.appendChild(
          createArtwork(artwork, section.title, index)
        );
      });

      element.appendChild(gallery);
      return element;
    }

    async function loadGallery() {
      try {
        const response = await fetch("./paintings.json");

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!Array.isArray(data.sections)) {
          throw new Error("Missing sections array");
        }

        container.replaceChildren();

        data.sections.forEach(section => {
          container.appendChild(createSection(section));
        });

      } catch (error) {
        console.error("Gallery loading error:", error);
        container.innerHTML = `
          <div class="error">
            The gallery could not be loaded.
            Please check paintings.json and the image paths.
          </div>
        `;
      }
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightboxImage.removeAttribute("src");
      document.body.style.overflow = "";
    }

    document.getElementById("close-lightbox")
      .addEventListener("click", closeLightbox);

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closeLightbox();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeLightbox();
    });

    loadGallery();
  </script>
</body>
</html>
